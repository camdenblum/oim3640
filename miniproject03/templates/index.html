<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MBTA Stop Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h1 class="text-center mb-1 fw-bold">MBTA Stop Finder</h1>
        <p class="text-center text-muted mb-4">Find the nearest T stop from any Boston-area location</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form action="/search" method="POST">
              <div class="mb-3">
                <label for="place_name" class="form-label fw-semibold">Place or address</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="place_name"
                  name="place_name"
                  placeholder="e.g. Fenway Park, MIT, Boston Common"
                  autofocus
                  required
                >
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100">Find Nearest Stop</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
