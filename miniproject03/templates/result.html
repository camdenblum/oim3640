<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results – MBTA Stop Finder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <style>
    #map { height: 400px; border-radius: 8px; }
  </style>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <h1 class="text-center fw-bold mb-1">Nearest MBTA Stop</h1>
        <p class="text-center text-muted mb-4">Results for <strong>{{ place_name }}</strong></p>

        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">
            <h2 class="card-title mb-1">{{ stop.name }}</h2>
            {% if stop.municipality %}
            <p class="text-muted mb-2">{{ stop.municipality }}</p>
            {% endif %}
            {% if stop.wheelchair_accessible %}
            <span class="badge bg-success fs-6">Wheelchair Accessible</span>
            {% else %}
            <span class="badge bg-secondary fs-6">Not Wheelchair Accessible</span>
            {% endif %}
          </div>
        </div>

        <div id="map" class="shadow-sm mb-4"></div>

        <a href="/" class="btn btn-outline-primary w-100">Search Again</a>

      </div>
    </div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = '{{ mapbox_key }}';

    const searchLng = {{ search_lng }};
    const searchLat = {{ search_lat }};
    const stopLng   = {{ stop.longitude }};
    const stopLat   = {{ stop.latitude }};

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: [searchLng, searchLat],
      zoom: 14
    });

    map.addControl(new mapboxgl.NavigationControl());

    // Blue pin = searched location
    new mapboxgl.Marker({ color: '#0d6efd' })
      .setLngLat([searchLng, searchLat])
      .setPopup(new mapboxgl.Popup().setText('{{ place_name }}'))
      .addTo(map);

    // Red pin = nearest MBTA stop
    new mapboxgl.Marker({ color: '#dc3545' })
      .setLngLat([stopLng, stopLat])
      .setPopup(new mapboxgl.Popup().setText('{{ stop.name }}'))
      .addTo(map);

    // Fit both pins in view
    map.fitBounds(
      [[Math.min(searchLng, stopLng), Math.min(searchLat, stopLat)],
       [Math.max(searchLng, stopLng), Math.max(searchLat, stopLat)]],
      { padding: 80 }
    );
  </script>
</body>
</html>
