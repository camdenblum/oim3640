version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nfl_predictor
      POSTGRES_USER: nfl_user
      POSTGRES_PASSWORD: nfl_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nfl_user -d nfl_predictor']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://nfl_user:nfl_password@postgres:5432/nfl_predictor
      REDIS_URL: redis://redis:6379
      ANALYTICS_SERVICE_URL: http://analytics:8001
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      ESPN_BASE_URL: https://site.api.espn.com/apis/site/v2/sports/football/nfl
      NFLVERSE_BASE_URL: https://github.com/nflverse/nflverse-data/releases/download
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    environment:
      DATABASE_URL: postgresql://nfl_user:nfl_password@postgres:5432/nfl_predictor
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./analytics:/app
      - analytics_cache:/app/cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  analytics_cache:
